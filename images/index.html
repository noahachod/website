<!-- ================= Main ================= -->
<main>

<div class="main-content">
  <div class="text-block">
    <p>Here's a mix of personal and commissioned images :P</p>
  </div>

<div class="image-gallery-grid">
    <div class="image-tile lightbox-trigger" data-src="/play_images/db_rs.jpg">
        <img src="/play_images/db_rs.jpg" alt="">
    </div>
    <div class="image-tile lightbox-trigger" data-src="/play_images/jod_colour_rs.jpg">
        <img src="/play_images/jod_colour_rs.jpg" alt="">
    </div>
    <div class="image-tile lightbox-trigger" data-src="/play_images/alwaysyou_rs.jpg">
        <img src="/play_images/alwaysyou_rs.jpg" alt="">
    </div>
    <div class="image-tile lightbox-trigger" data-src="/play_images/dragon_rs.jpg">
        <img src="/play_images/dragon_rs.jpg" alt="">
    </div>
    <div class="image-tile lightbox-trigger" data-src="/play_images/cats_rs.jpg">
        <img src="/play_images/cats_rs.jpg" alt="">
    </div>
    <div class="image-tile lightbox-trigger" data-src="/play_images/ben_rs.jpg">

    <div class="image-tile lightbox-trigger" data-src="/play_images/tattoo_rs.jpg">
        <img src="/play_images/tattoo_rs.jpg" alt="">
    </div>
</div>

<!-- Lightbox -->
<div class="image-lightbox" id="imageLightbox">
    <img id="imageLightboxImg" alt="">
</div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.querySelector(".menu-toggle");
    const sidebar = document.querySelector(".sidebar");
    if (toggle && sidebar) {
        toggle.addEventListener("click", function () {
            sidebar.classList.toggle("open");
        });
    }
    const grid = document.querySelector(".image-gallery-grid");
const tiles = Array.from(grid.querySelectorAll(".image-tile"));
tiles.sort(() => Math.random() - 0.5);
tiles.forEach(tile => grid.appendChild(tile));
    const triggers = document.querySelectorAll(".lightbox-trigger");
    const lightbox = document.getElementById("imageLightbox");
    const img = document.getElementById("imageLightboxImg");

    triggers.forEach(tile => {
        tile.addEventListener("click", function () {
            img.src = this.dataset.src;
            lightbox.classList.add("active");
        });
    });

    lightbox.addEventListener("click", function () {
        lightbox.classList.remove("active");
        img.src = "";
    });

    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            lightbox.classList.remove("active");
            img.src = "";
        }
    });
});

document.querySelectorAll('.nav a').forEach(a => {
    if (a.href === window.location.href) {
        a.classList.add('active');
    }
});
</script>


</body>
</html>
